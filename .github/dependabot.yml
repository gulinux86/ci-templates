# Keeps the actions this composite action calls current. They are pinned by commit
# SHA so their code cannot change underneath callers, but a SHA never moves on its
# own — without this, security fixes in configure-aws-credentials or
# setup-terraform would stop arriving unnoticed. Dependabot proposes the new SHA
# and rewrites the trailing `# vX.Y.Z` comment in the same PR.
#
# `directory` points at the action itself: Dependabot scans .github/workflows from
# `/`, and this repository has no workflows — only the composite action.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /.github/actions/aws-terraform-setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
