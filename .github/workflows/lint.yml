# Lints this repository's own workflows and actions. A consumer pins a commit of this
# repository: a workflow GitHub rejects here becomes a startup_failure in every
# repository that pinned it, with no log.
name: lint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install actionlint
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "/tmp/$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/$TARBALL" -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      # shellcheck is on the runner image; actionlint runs it on every run: block.
      - name: actionlint
        run: actionlint -color
